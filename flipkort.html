#sf input{flex:1;padding:12px;border:0;border-radius:6px 0 0 6px;font-size:16px;margin:0}#sf button{border:0;background:var(--s);padding:0 14px;border-radius:0 6px 6px 0}
#nav{display:flex;gap:4px;margin-left:auto}#nav a{padding:10px;border-radius:6px;font-size:14px;color:#fff}#nav a:hover{background:#ffffff22}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff}.chips a{white-space:nowrap;padding:8px 14px;border:1px solid #d5dbe5;border-radius:99px;font-size:14px}
main{max-width:1100px;margin:auto;padding:12px}h2{margin:16px 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card,.box{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px #0001;margin-bottom:8px}.card{margin:0}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card h3{font-size:14px;margin:6px 0;height:2.6em;overflow:hidden}
.pr s{color:#777;font-size:13px}.off,.ok{color:var(--ok);font-weight:600;font-size:13px}.warn{color:var(--er);font-weight:600}.row{display:flex;gap:6px;margin-top:6px}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:12px 16px;font-size:15px;cursor:pointer;flex:1;min-height:44px;text-align:center;display:inline-block}.btn.y{background:var(--s);color:var(--t);font-weight:700}.btn.g{background:#fff;color:var(--p);border:1px solid var(--p)}
.row button:not(.btn){border:1px solid #d5dbe5;background:#fff;border-radius:6px;width:44px;font-size:18px}
.deal{background:linear-gradient(135deg,var(--p),#1a4fb0);color:#fff;border-radius:12px;padding:14px;display:grid;gap:12px}@media(min-width:700px){.deal{grid-template-columns:200px 1fr;align-items:center}}
.deal img{width:100%;max-height:200px;object-fit:contain;background:#fff;border-radius:8px}.timer{font:700 34px ui-monospace,monospace;letter-spacing:2px;color:var(--s)}
input,select,textarea{width:100%;padding:12px;margin:4px 0;border:1px solid #cfd6e2;border-radius:6px;font:inherit}label{font-size:13px}
.load,.empty{text-align:center;padding:40px;color:#555}.split{display:grid;gap:14px}@media(min-width:800px){.split{grid-template-columns:1fr 1fr}}
.pimg{width:100%;max-height:420px;object-fit:contain;background:#fff;border-radius:10px}.err{color:var(--er)}.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:3px;background:#d5dbe5}.steps i.on{background:var(--ok)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:#212121;color:#fff;padding:12px 18px;border-radius:8px;transition:.25s;z-index:9}#toast.show{transform:translate(-50%,0)}

async function search(arg,r){

 if(r==='c')q=q.eq('category_id',arg);else if(arg){t=arg.replace(/[,()%]/g,' ');q=q.or(`name.ilike.%${t}%,brand.ilike.%${t}%,sku.ilike.%${t}%`)}
 const {data}=await q;let l=data?.length?data:filterLocal(arg,r);const f=app._f||{sort:'new',stock:false};
 const draw=()=>{let x=l.filter(p=>!f.stock||p.stock>0);
  x.sort({low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,disc:(a,b)=>pct(b.mrp,b.price)-pct(a.mrp,a.price),new:(a,b)=>new Date(b.created_at)-new Date(a.created_at)}[f.sort]);$('#res').innerHTML=grid(x)};

 $('#so').onchange=e=>{f.sort=e.target.value;draw()};$('#st').onchange=e=>{f.stock=e.target.checked;draw()};draw();
}

async function admin(){
 if(role!=='admin'){app.innerHTML='<div class="empty err">Admins only.</div>';return}
 const {data:c}=await sb.from('categories').select('*'),{data:ps}=await sb.from('products').select('id,name').order('created_at',{ascending:false}),{data:os}=await sb.from('orders').select('id,status,total,payment_status').neq('payment_status','PENDING').order('created_at',{ascending:false}).limit(30);
 app.innerHTML=`<button class="btn y" id="imp">Import built-in demo products (with images) into Supabase</button><h2>Add product (up to any number)</h2><form id="pf" class="box"><input name="name" placeholder="Name" required><input name="brand" placeholder="Brand"><input name="sku" placeholder="SKU"><select name="category_id">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
 <input name="mrp" type="number" step="0.01" placeholder="MRP ₹" required><input name="price" type="number" step="0.01" placeholder="Offer price ₹" required><input name="stock" type="number" placeholder="Stock" required><input name="upi_link" placeholder="UPI payment link (optional)">
 <textarea name="description" placeholder="Description"></textarea><textarea name="specs" placeholder='Specs as JSON e.g. {"Display":"2.3 inch","Battery":"300mAh"}'></textarea><label>Images (first = primary)<input name="files" type="file" accept="image/*" multiple required></label>
 <label><input type="checkbox" name="is_limited" style="width:auto"> Limited offer</label> <label><input type="checkbox" name="is_combo" style="width:auto"> Combo</label><div id="ae" class="err"></div><button class="btn">Save product</button></form>
 <h2>Flash deal</h2><form id="df" class="box"><select name="product_id">${ps.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input name="deal_price" type="number" step="0.01" placeholder="Deal price ₹" required><input name="stock_limit" type="number" value="50" required>
 <select name="duration_seconds"><option value="1800">30 min</option><option value="3600">1 hour</option><option value="7200" selected>2 hours</option><option value="10800">3 hours</option><option value="21600">6 hours</option><option value="43200">12 hours</option><option value="86400">24 hours</option></select><input name="display_order" type="number" value="1" placeholder="Order"><button class="btn">Add deal</button></form>
 <h2>Orders</h2>${(os||[]).map(o=>`<div class="box">#${o.id.slice(0,8)} · ${inr(o.total)} · ${o.payment_status} <select data-os="${o.id}">${[...STEPS,'CANCELLED','RETURNED','REFUNDED'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}`;
 $('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),ae=$('#ae');ae.textContent='';
  try{const urls=[];for(const file of f.getAll('files')){const path=`${crypto.randomUUID()}-${file.name.replace(/[^\w.]/g,'_')}`;const {error}=await sb.storage.from('products').upload(path,file);if(error)throw error;urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl)}
   const row=Object.fromEntries([...f.entries()].filter(([k])=>k!=='files'));row.specs=row.specs?JSON.parse(row.specs):{};row.is_limited=!!row.is_limited;row.is_combo=!!row.is_combo;row.image_url=urls[0];row.images=urls.slice(1);
   const {error}=await sb.from('products').insert(row);if(error)throw error;toast('Product saved');admin()}catch(x){ae.textContent='Could not save (check specs JSON / image upload).'}};
 $('#imp').onclick=async()=>{toast('Importing…');try{const cat=c.find(x=>x.name==='Smart Watches')||c[0],ids=[];
  for(const p of LOCAL){const blob=await (await fetch(p.image_url)).blob(),path=crypto.randomUUID()+'.webp',u=await sb.storage.from('products').upload(path,blob,{contentType:'image/webp'});if(u.error)throw u.error;
   const {data,error}=await sb.from('products').insert({name:p.name,brand:p.brand,sku:p.sku,category_id:cat?.id,description:p.description,mrp:p.mrp,price:p.price,stock:p.stock,image_url:sb.storage.from('products').getPublicUrl(path).data.publicUrl,is_limited:p.is_limited,is_combo:p.is_combo}).select('id').single();if(error)throw error;ids.push(data.id)}
  for(const [i,id] of ids.slice(0,5).entries())await sb.from('flash_deals').insert({product_id:id,deal_price:Math.round(LOCAL[i].price*0.9),stock_limit:20,display_order:i+1});toast('Imported!');admin()}catch(x){console.error(x);toast('Import failed: check admin login and schema.sql')}};
 $('#df').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('flash_deals').insert(Object.fromEntries(new FormData(e.target)));toast(error?'Could not add deal':'Deal added')};
 app.onchange=async e=>{if(e.target.dataset.os)await sb.from('orders').update({status:e.target.value}).eq('id',e.target.dataset.os)};
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-add],[data-wl],[data-buy],[data-rm],[data-q],[data-dad]');if(!b)return;const d=b.dataset;const lid=d.add||d.wl||d.buy;if(lid&&String(lid).startsWith('L')){toast('Demo item. Admin: click "Import demo products" first.');return}
 if(d.buy){if(need())location.hash='#/checkout/'+d.buy;return}if(!need())return;let r;
 if(d.add){const {data:x}=await sb.from('cart_items').select('qty').eq('product_id',d.add).maybeSingle();r=await sb.from('cart_items').upsert({user_id:me.id,product_id:d.add,qty:(x?.qty||0)+1});toast(r.error?'Could not add':'Added to cart')}
 if(d.wl){r=await sb.from('wishlist').upsert({user_id:me.id,product_id:d.wl});toast(r.error?'Could not save':'Added to wishlist')}
 if(d.rm){await sb.from('cart_items').delete().eq('product_id',d.rm);cart()}
 if(d.q){const [id,q]=d.q.split(':');q<1?await sb.from('cart_items').delete().eq('product_id',id):await sb.from('cart_items').update({qty:+q}).eq('product_id',id);cart()}
 if(d.dad){await sb.from('addresses').delete().eq('id',d.dad);profile()}});
init();

</script></body></html>
